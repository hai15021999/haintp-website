<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Inter, Segoe UI, sans-serif">
  <rect width="640" height="360" fill="#e7f2ec"/>
  <!-- Excel window -->
  <g transform="translate(40 32)">
    <rect width="560" height="300" rx="10" fill="#ffffff" stroke="#cfe0d6"/>
