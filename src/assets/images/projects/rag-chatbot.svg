      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#e0f2f1"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- documents -->
  <g transform="translate(36 64)">
    <g transform="rotate(-6)">
      <rect width="96" height="122" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
      <g fill="#c7d2fe"><rect x="14" y="18" width="60" height="7" rx="3"/><rect x="14" y="34" width="68" height="6" rx="3"/><rect x="14" y="46" width="52" height="6" rx="3"/><rect x="14" y="58" width="64" height="6" rx="3"/></g>
    </g>
    <g transform="translate(26 26)">
