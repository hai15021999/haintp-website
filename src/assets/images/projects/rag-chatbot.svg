    <path d="M16 44c0 4.4 11.6 8 26 8s26-3.6 26-8" fill="none" stroke="#6366f1"/>
    <g fill="#6366f1"><circle cx="30" cy="36" r="2"/><circle cx="46" cy="40" r="2"/><circle cx="56" cy="58" r="2"/><circle cx="34" cy="60" r="2"/></g>
    <text x="42" y="86" font-size="9" font-weight="600" fill="#64748b" text-anchor="middle">vectors</text>
  </g>
