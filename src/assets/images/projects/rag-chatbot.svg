    <g transform="translate(16 114)">
      <rect width="210" height="96" rx="12" fill="#f1f5f9"/>
      <g fill="#475569"><rect x="12" y="14" width="180" height="7" rx="3"/><rect x="12" y="27" width="166" height="7" rx="3"/><rect x="12" y="40" width="176" height="7" rx="3"/><rect x="12" y="53" width="120" height="7" rx="3"/></g>
