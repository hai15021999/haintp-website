  </g>
  <text x="40" y="70" font-size="34" font-weight="700" fill="#fff3c4">Moonlight</text>
  <text x="40" y="98" font-size="15" fill="#c9c3f2">Werewolf game-master assistant</text>
  <g transform="translate(40 118)">
    <rect width="64" height="22" rx="11" fill="#3b3270"/>
    <text x="32" y="15" font-size="11" font-weight="600" fill="#e7e3ff" text-anchor="middle">Night 3</text>
    <rect x="72" width="84" height="22" rx="11" fill="#3b3270"/>
    <text x="114" y="15" font-size="11" font-weight="600" fill="#e7e3ff" text-anchor="middle">9 alive</text>
