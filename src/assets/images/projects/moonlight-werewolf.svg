<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1630"/>
      <stop offset="1" stop-color="#28204a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff6d6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#sky)"/>
  <g fill="#ffffff">
    <circle cx="60" cy="40" r="1.4"/><circle cx="140" cy="90" r="1"/><circle cx="220" cy="30" r="1.2"/>
    <circle cx="330" cy="60" r="1"/><circle cx="410" cy="24" r="1.4"/><circle cx="600" cy="120" r="1"/>
    <circle cx="560" cy="40" r="1.2"/><circle cx="30" cy="150" r="1"/><circle cx="270" cy="120" r="1"/>
  </g>
  <circle cx="500" cy="92" r="90" fill="url(#glow)"/>
  <circle cx="500" cy="92" r="46" fill="#fff3c4"/>
  <circle cx="486" cy="80" r="7" fill="#efe0a6"/>
  <circle cx="512" cy="104" r="5" fill="#efe0a6"/>
  <!-- hills and wolf -->
  <path d="M0 300 C120 250 220 270 320 240 C420 210 520 250 640 230 V360 H0 Z" fill="#1a1433"/>
  <path d="M410 238 l10 -26 l6 14 l10 -4 l4 -18 l8 20 l14 6 l-6 10 l-34 4 z" fill="#0b0a18"/>
  <!-- role cards -->
  <g transform="translate(40 196)">
    <g transform="rotate(-8)">
      <rect width="86" height="118" rx="8" fill="#2c2552" stroke="#7a6fd0"/>
      <text x="43" y="62" font-size="30" text-anchor="middle">🐺</text>
      <rect x="18" y="88" width="50" height="7" rx="3" fill="#9b8ff0"/>
    </g>
    <g transform="translate(78 -6)">
      <rect width="86" height="118" rx="8" fill="#2c2552" stroke="#7a6fd0"/>
      <text x="43" y="62" font-size="30" text-anchor="middle">🔮</text>
      <rect x="18" y="88" width="50" height="7" rx="3" fill="#9b8ff0"/>
    </g>
    <g transform="translate(160 4) rotate(8)">
      <rect width="86" height="118" rx="8" fill="#2c2552" stroke="#7a6fd0"/>
      <text x="43" y="62" font-size="30" text-anchor="middle">🧪</text>
      <rect x="18" y="88" width="50" height="7" rx="3" fill="#9b8ff0"/>
