  <script>
    /* Apply the saved color mode before Angular boots (no light flash). Keep in sync with ThemeService. */
    (function () {
      try {
        var mode = localStorage.getItem('haintp.theme') || 'system';
        var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        if (localStorage.getItem('haintp.sidenav') === 'rail') document.documentElement.setAttribute('data-sidenav', 'rail');
      } catch (e) {}
    })();
  </script>
